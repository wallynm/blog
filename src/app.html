<!DOCTYPE html>
<html lang="pt-BR" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="/favicon.png" />

		<!-- Fonts are self-hosted (static/fonts), so there is no third-party origin
		     to preconnect to. Preloaded because they are used above the fold. -->
		<link rel="preload" href="/fonts/Atkinson-Hyperlegible-Regular-102a.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/Atkinson-Hyperlegible-Bold-102a.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="/css/fonts.css" />
		<link rel="stylesheet" href="/css/prism.css" />

		<link rel="alternate" type="application/rss+xml" title="Wallynm Blog" href="/api/rss.xml" />

		<!-- Runs before first paint so the correct theme is applied without a flash.
		     Kept inline and dependency-free for that reason. -->
		<script>
			window.changeThemeMode = function (theme) {
				var dark =
					theme === 'dark' ||
					(!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', dark);
			};

			try {
				window.changeThemeMode(localStorage.getItem('theme'));
			} catch (e) {
				// Storage can throw in private mode; the default class stands.
			}
		</script>

		%sveltekit.head%
	</head>
	<body>
		<div id="svelte">%sveltekit.body%</div>
	</body>
</html>
